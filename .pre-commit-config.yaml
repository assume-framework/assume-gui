repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.7
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-illegal-windows-names
  - repo: local
    hooks:
      # Frontend formatting. Uses the prettier version pinned in package.json
      # (requires `npm ci`); --no-install avoids fetching a different version.
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write
        language: system
        files: ^src/
        types_or: [ts, tsx, css]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        types_or: [python, rst, markdown]
        files: ^(assume|docs|tests)/
